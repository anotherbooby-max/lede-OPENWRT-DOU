name: Build OpenWrt x86_64 Intel5100 BIOS+UEFI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 深度清理磁盘，释放最大空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt clean
          df -h

      - name: 克隆 lede master 源码
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede.git
          cd lede
          git log -1 --oneline

      - name: 强制锁定x86内核5.4
        run: |
          cd lede
          sed -i 's/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=5.4/' target/linux/x86/Makefile

      - name: 更新feeds & install
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成基础配置 + 强制写入关键选项
        run: |
          cd lede
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_IMAGES_PAD=y
          CONFIG_KERNEL_XZ=n
          CONFIG_KERNEL_GZ=y
          CONFIG_PACKAGE_kmod-iwlwifi=m
          CONFIG_PACKAGE_kmod-mac80211=m
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_linux-firmware-iwlwifi-5000=y
          CONFIG_PACKAGE_hostapd=y
          CONFIG_PACKAGE_hostapd-common=y
          CONFIG_PACKAGE_hostapd-utils=y
          CONFIG_PACKAGE_wpa-supplicant=y
          CONFIG_PACKAGE_wpad-mini=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-wireless=y
          CONFIG_PACKAGE_luci-proto-wireless=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_pciutils=y
          # 精简：不编译无关插件，节约空间
          CONFIG_DEVEL=n
          CONFIG_PACKAGE_luci-app-adguardhome=n
          CONFIG_PACKAGE_luci-app-openclash=n
          EOF
          # defconfig归一，自动处理依赖冲突
          make defconfig
          # 打印关键配置，日志可核查是否生效
          grep -E 'TARGET_x86|KERNEL_PATCHVER|kmod-iwlwifi|GRUB_EFI|CONFIG_TARGET_ROOTFS_EXT4FS' .config

      - name: 注入 iwlwifi 防panic配置
        run: |
          cd lede
          mkdir -p package/base-files/files/etc/modprobe.d
          cat > package/base-files/files/etc/modprobe.d/iwlwifi.conf <<'EOF'
          options iwlwifi power_save=0 swcrypto=1 11n_disable=0 amsdu_size=3
          blacklist iwldvm
          EOF
          cat package/base-files/files/etc/modprobe.d/iwlwifi.conf

      - name: 下载源码包
        run: |
          cd lede
          make download -j1
        timeout-minutes: 60

      - name: 单线程编译 -j1，降低内存压力
        run: |
          cd lede
          make -j1 V=s 2>&1 | tee build.log
        timeout-minutes: 480

      - name: 校验镜像是否生成
        run: |
          cd lede
          IMG_DIR="bin/targets/x86/64"
          if [ -d "$IMG_DIR" ];then
            ls -lh $IMG_DIR
            if ls -1 $IMG_DIR/*.img.gz >/dev/null 2>&1 ; then
              echo "✅ 镜像文件已生成"
            else
              echo "⚠️ WARNING: NO IMAGE FILES GENERATED! 资源不足未生成镜像，重新run workflow重试"
            fi
          else
            echo "❌ $IMG_DIR 目录不存在"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt‑x86‑64‑Intel5100
          path: |
            lede/bin/targets/x86/64/*
            lede/build.log
          if-no-files-found: warn
